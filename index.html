<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>中国象棋 — Vs Bot</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root { --cell:66px; }
  body { margin:0; font-family:"ZCOOL XiaoWei","KaiTi",serif; background:radial-gradient(circle at center,#f4e1b1,#c49b5a); display:flex; flex-direction:column; align-items:center; min-height:100vh; overflow-y:auto; }
  h1 { font-size:56px; margin:24px 0 8px 0; color:#3a1e00; text-shadow:2px 2px 6px rgba(0,0,0,0.35); letter-spacing:8px; }
  .back-btn { position:absolute; top:18px; left:18px; background:linear-gradient(to bottom,#f8ecce,#d1a85c); border:4px solid #5a3a1a; border-radius:12px; padding:8px 18px; font-size:18px; cursor:pointer; box-shadow:2px 2px 10px rgba(0,0,0,0.25); }
  .back-btn:hover { transform:scale(1.02); }
  .board-frame { margin:14px; padding:22px; border-radius:18px; border:22px ridge #5a3a1a; background:linear-gradient(145deg,#e3c38c,#c99c59); box-shadow:0 8px 40px rgba(0,0,0,0.45), inset 0 0 14px rgba(0,0,0,0.25); display:flex; justify-content:center; align-items:center; }
  #board { position:relative; width:calc(8*var(--cell)); height:calc(9*var(--cell)); background:linear-gradient(to bottom,#fae9b4,#e2c678); border-radius:8px; box-shadow:inset 0 0 24px rgba(0,0,0,0.28); touch-action:manipulation; }
  .hline,.vline{position:absolute;background:#3b2508;} .hline{height:2px;left:0;right:0;} .vline{width:2px;top:0;}
  .river { position:absolute; left:0; right:0; top:calc(4.5*var(--cell)); text-align:center; font-size:20px; color:#5c3c14; letter-spacing:8px; pointer-events:none; }
  .intersection { position:absolute; width:var(--cell); height:var(--cell); margin-left:calc(var(--cell)/-2); margin-top:calc(var(--cell)/-2); left:0; top:0; cursor:pointer; z-index:5; } 
  .intersection:hover { background:rgba(200,160,90,0.08); border-radius:50%; }
  .piece { position:absolute; width:56px;height:56px; margin-left:-28px;margin-top:-28px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 30% 30%,#fffaf0,#e8c888); border:3px solid #4a2d00; font-weight:bold; font-size:28px; cursor:pointer; z-index:10; user-select:none; box-shadow:0 3px 8px rgba(0,0,0,0.25); transition:transform .12s ease, box-shadow .12s ease;}
  .piece:hover{transform:scale(1.06); box-shadow:0 6px 18px rgba(0,0,0,0.33);}
  .red{color:#c00000;border-color:#c00000;}
  .black{color:#111;border-color:#111;}
  .selected{outline:4px solid rgba(255,240,0,0.9); box-shadow:0 0 18px rgba(255,240,0,0.25); transform:scale(1.08);}
  #end-screen{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.75); z-index:999; color:white; font-size:64px; flex-direction:column; text-align:center;}
  #end-screen button{margin-top:20px;font-size:20px;padding:10px 18px;border-radius:10px;background:#f7e4a8;border:none;cursor:pointer;}
</style>
</head>
<body>
<button class="back-btn" onclick="location.href='homepage.html'">← 返回主页</button>
<h1>中国象棋 — Vs Bot</h1>
<div class="board-frame"><div id="board"></div></div>
<div id="end-screen"></div>

<script>
// --- Query string difficulty ---
const urlParams = new URLSearchParams(window.location.search);
const difficulty = urlParams.get('level') || 'easy'; // default easy

// --- Board setup ---
const s = 66;
const cols = 9, rows = 10;
const boardEl = document.getElementById('board');

const sym = { rK:"帥",bK:"將",rA:"仕",bA:"士",rE:"相",bE:"象",rN:"傌",bN:"馬",rR:"俥",bR:"車",rM:"炮",bM:"炮",rP:"兵",bP:"卒" };

let board=[
["bR","bN","bE","bA","bK","bA","bE","bN","bR"],
["","","","","","","","",""],
["","bM","","","","","","bM",""],
["bP","","bP","","bP","","bP","","bP"],
["","","","","","","","",""],
["","","","","","","","",""],
["rP","","rP","","rP","","rP","","rP"],
["","rM","","","","","","rM",""],
["","","","","","","","",""],
["rR","rN","rE","rA","rK","rA","rE","rN","rR"]
];

let turn='r', selected=null;
const endScreen=document.getElementById('end-screen');

// --- Draw board grid ---
function drawGrid(){
  boardEl.style.width=`${(cols-1)*s}px`;
  boardEl.style.height=`${(rows-1)*s}px`;
  for(let r=0;r<rows;r++){
    const h=document.createElement('div'); h.className='hline'; h.style.top=`${r*s}px`; boardEl.appendChild(h);
  }
  for(let c=0;c<cols;c++){
    const v=document.createElement('div'); v.className='vline'; v.style.left=`${c*s}px`;
    if(c===0 || c===cols-1){ v.style.height=`${(rows-1)*s}px`; } else { v.style.height=`${4*s}px`; const v2=v.cloneNode(); v2.style.top=`${5*s}px`; v2.style.height=`${4*s}px`; boardEl.appendChild(v2);}
    boardEl.appendChild(v);
  }
  const river=document.createElement('div'); river.className='river'; river.textContent='楚河          汉界'; boardEl.appendChild(river);

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const sq=document.createElement('div'); sq.className='intersection';
      sq.style.left=`${c*s}px`; sq.style.top=`${r*s}px`;
      sq.dataset.r=r; sq.dataset.c=c;
      sq.onclick=()=>{ onSquareClick(r,c); };
      boardEl.appendChild(sq);
    }
  }
}

// --- Draw pieces ---
function drawPieces(){
  document.querySelectorAll('.piece').forEach(x=>x.remove());
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const p=board[r][c]; if(!p) continue;
      const el=document.createElement('div'); el.className='piece '+(p[0]==='r'?'red':'black');
      el.textContent=sym[p]||p; el.style.left=`${c*s}px`; el.style.top=`${r*s}px`;
      el.dataset.r=r; el.dataset.c=c;
      el.onclick=()=>{ onPieceClick(r,c); };
      if(selected && selected[0]===r && selected[1]===c) el.classList.add('selected');
      boardEl.appendChild(el);
    }
  }
}

// --- Click handlers ---
function onPieceClick(r,c){
  if(turn==='b') return; // only allow player (red) to move
  const p=board[r][c]; if(!p) return;
  if(selected){
    const sp=board[selected[0]][selected[1]];
    if(p[0]===sp[0]){ selected=[r,c]; drawPieces(); return; }
    tryMove(selected[0],selected[1],r,c);
  }else{
    if(p[0]!==turn) return;
    selected=[r,c]; drawPieces();
  }
}

function onSquareClick(r,c){ if(selected) tryMove(selected[0],selected[1],r,c); }

// --- Movement rules ---
function inBounds(r,c){ return r>=0 && r<rows && c>=0 && c<cols; }
function clearPath(sr,sc,r,c){ if(sr===r){ const step=sc<c?1:-1; for(let i=sc+step;i!==c;i+=step) if(board[sr][i]) return false; return true; } else if(sc===c){ const step=sr<r?1:-1; for(let i=sr+step;i!==r;i+=step) if(board[i][sc]) return false; return true; } return false; }

function valid(sr,sc,r,c,p){
  if(sr===r && sc===c) return false;
  if(!inBounds(r,c)) return false;
  if(board[r][c] && board[r][c][0]===p[0]) return false;
  const dr=r-sr,dc=c-sc,ar=Math.abs(dr),ac=Math.abs(dc),color=p[0],type=p[1];
  switch(type){
    case'R': return (sr===r||sc===c)&&clearPath(sr,sc,r,c);
    case'N':{
      if(!((ar===2&&ac===1)||(ar===1&&ac===2))) return false;
      let legR=sr+(dr===2?1:(dr===-2?-1:0));
      let legC=sc+(dc===2?1:(dc===-2?-1:0));
      if(ar===1){ legR=sr; legC=sc+(dc>0?1:-1);}
      if(!inBounds(legR,legC)) return false;
      return !board[legR][legC];
    }
    case'E':{
      if(!(ar===2&&ac===2)) return false;
      const eyeR=sr+dr/2,eyeC=sc+dc/2;
      if(!inBounds(eyeR,eyeC)) return false;
      if(board[eyeR][eyeC]) return false;
      if(color==='r') return r>=5;
      return r<=4;
    }
    case'A':{
      if(!(ar===1&&ac===1)) return false;
      const palRows=(color==='r')?[7,8,9]:[0,1,2]; const palCols=[3,4,5];
      return palRows.includes(r)&&palCols.includes(c);
    }
    case'K':{
      if(!(ar+ac===1)) return false;
      const palRows=(color==='r')?[7,8,9]:[0,1,2]; const palCols=[3,4,5];
      return palRows.includes(r)&&palCols.includes(c);
    }
    case'M':{
      if(!(sr===r||sc===c)) return false;
      let cnt=0;
      if(sr===r){ const step=sc<c?1:-1; for(let i=sc+step;i!==c;i+=step) if(board[sr][i]) cnt++; } else { const step=sr<r?1:-1; for(let i=sr+step;i!==r;i+=step) if(board[i][sc]) cnt++; }
      if(!board[r][c]) return cnt===0;
      return cnt===1;
    }
    case'P':{
      const forward=(color==='r')?-1:1;
      const crossed=(color==='r')?sr<=4:sr>=5;
      if(!crossed){ return dc===0&&dr===forward; } else { if(ar+ac!==1) return false; if(dr===-forward) return false; return true; }
    }
  }
  return false;
}

// --- Try move ---
function tryMove(sr,sc,r,c){
  const p=board[sr][sc]; if(!p) return;
  if(valid(sr,sc,r,c,p)){
    if(board[r][c]&&board[r][c][1]==='K'){ board[r][c]=p; board[sr][sc]=""; drawPieces(); return endGame(p[0]); }
    board[r][c]=p; board[sr][sc]=""; turn=(turn==='r'?'b':'r'); drawPieces();
    selected=null;
    if(turn==='b') setTimeout(botMove,300);
    return;
  }
  selected=null; drawPieces();
}

// --- Bot move ---
function botMove(){
  if(turn!=='b') return;
  const moves=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const p=board[r][c]; if(!p||p[0]!=='b') continue;
      for(let rr=0;rr<rows;rr++){
        for(let cc=0;cc<cols;cc++){
          if(valid(r,c,rr,cc,p)) moves.push({from:[r,c],to:[rr,cc],capture:board[rr][cc]?true:false, piece:p});
        }
      }
    }
  }
  if(moves.length===0) return; // no moves
  let chosen;
  if(difficulty==='easy'){ chosen=moves[Math.floor(Math.random()*moves.length)]; }
  else if(difficulty==='medium'){
    const caps=moves.filter(m=>m.capture); chosen=caps.length>0?caps[Math.floor(Math.random()*caps.length)]:moves[Math.floor(Math.random()*moves.length)];
    chosen=chosen||moves[0];
  }
  else{ // hard: simple material scoring
    const values={'K':1000,'A':5,'E':5,'N':6,'R':10,'M':8,'P':3};
    let bestScore=-Infinity;
    for(const m of moves){
      let score=0; if(m.capture){ score=values[m.piece[1]]||1; } if(score>bestScore){ bestScore=score; chosen=m; }
    }
    if(!chosen) chosen=moves[0];
  }
  tryMove(chosen.from[0],chosen.from[1],chosen.to[0],chosen.to[1]);
}

// --- End game ---
function endGame(color){ const winner=color==='r'?'红方胜利！':'黑方胜利！'; endScreen.innerHTML=`<div>${winner}</div><button onclick="location.reload()">再来一局</button>`; endScreen.style.display='flex'; }

// --- Init ---
drawGrid(); drawPieces();
</script>
</body>
</html>
